#
#
# To test local Docker image changes for any of the services below, comment out the `image:` line
# and uncomment the corresponding `build:` section to build the image locally from their Dockerfile.
#
# If a container consistently fails to start, try removing active containers and clearing associated
# volumes - this is often caused by corrupted node modules or Ruby gem installations.
#
#

networks:
  frontnet:
  backnet:
    internal: true

services:
  formatif-dev-container:
    container_name: 1-formatif-dev-container
    image: lmsdoubtfire/formatif-devcontainer:11.0
    # build:
      # context: ../
      # dockerfile: dev.Dockerfile
    volumes:
      # Mounts the project folder to '/workspace'. While this file is in .devcontainer,
      # mounts are relative to the first file in the list, which is a level up.
      - ..:/workspace:cached
      - formatif_tmp_compose:/workspace/tmp
      - formatif_student-work_compose:/student-work
      - jplag_results:/jplag/results
      - ws_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/doubtfire-web/node_modules
      - formatif_gems_compose:/home/vscode/.gems
      - codex_home:/home/vscode/.codex
      - claude_home:/home/vscode/.claude
      - vscode_server_home:/home/vscode/.vscode-server
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontnet
      - backnet
    ports:
      - "9876:9876"
      - "4200:4200"
      - "3000:3000"
    # Overrides default command so things don't shut down after the process ends.
    # command: /bin/sh -c "while sleep 5000; do :; done"
    env_file:
      - devcontainer.env
    environment:
      LATEX_CONTAINER_NAME: 1-formatif-texlive-container
      LATEX_BUILD_PATH: /texlive/shell/latex_build.sh
    depends_on:
      - dev-db
      - gotenberg-volumes

  dev-db:
    container_name: doubtfire-dev-db
    image: mariadb:10
    restart: always
    volumes:
      - formatif_db_compose:/var/lib/mysql
    env_file:
      - devcontainer.env
    networks:
      - backnet

  redis-sidekiq:
    container_name: doubtfire-redis-sidekiq
    image: redis:7
    volumes:
      - formatif_redis_sidekiq_data:/data
    networks:
      - backnet

  overseer-volumes:
    container_name: doubtfire-overseer
    image: alpine
    command: sleep infinity
    volumes:
      - ../doubtfire-api/tmp/overseer:/overseer/work-dir

  texlive:
    container_name: 1-formatif-texlive-container
    image: lmsdoubtfire/formatif-latex:11.0
    # build:
      # context: ../
      # dockerfile: texlive.Dockerfile
    volumes:
      - formatif_student-work_compose:/student-work
      - ../doubtfire-api/tmp/rails-latex:/workdir/texlive-latex
      - ../doubtfire-api/public/assets/images:/workspace/doubtfire-api/public/assets/images
      - ../doubtfire-api/test_files:/workspace/doubtfire-api/test_files
    depends_on:
      - formatif-dev-container
    command: /bin/sh -c "sleep infinity"

  # JPlag
  jplag:
    container_name: jplag
    image: lmsdoubtfire/doubtfire-jplag:11.0
    # build:
      # context: ../
      # dockerfile: jplag.Dockerfile
    volumes:
      - formatif_student-work_compose:/student-work
      - jplag_results:/jplag/results
      - ../doubtfire-api/tmp/jplag:/tmp/jplag
    command: /bin/sh -c "sleep infinity"
    depends_on:
      - formatif-dev-container
    env_file:
      - ./devcontainer.env
    network_mode: none

  gotenberg:
    # Image definition only. Each conversion starts its own network-isolated
    # container. If the full Compose stack is started, this service exits
    # immediately after ensuring that the image has been built.
    image: lmsdoubtfire/doubtfire-gotenberg:11.1
    # build:
    #   context: ../doubtfire-api
    #   dockerfile: gotenberg.Dockerfile
    entrypoint: /bin/true
    network_mode: none

  gotenberg-volumes:
    container_name: doubtfire-gotenberg-volumes
    image: alpine
    command: sleep infinity
    restart: unless-stopped
    volumes:
      - ../doubtfire-api/tmp/gotenberg:/workdir/gotenberg
    network_mode: none

volumes:
  ws_node_modules:
  web_node_modules:
  formatif_tmp_compose:
  formatif_student-work_compose:
  formatif_db_compose:
  formatif_gems_compose:
  formatif_redis_sidekiq_data:
  jplag_results:
  codex_home:
  claude_home:
  vscode_server_home:
